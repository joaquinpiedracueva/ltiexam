<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Simulador de Cuestionarios</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Serif:wght@400;500&display=swap">
<style>
:root{
  color-scheme: light;
  --bg:#f2f4f7; --surface:#ffffff; --surface-2:#e9edf3; --surface-3:#dfe5ed;
  --border:#d3dae4; --border-strong:#b6c2d1;
  --text:#16202b; --text-dim:#5c6979; --text-faint:#8593a4;
  --accent:#2b6796; --accent-ink:#ffffff; --accent-soft:#dde8f3;
  --ok:#1c7a54; --ok-soft:#dcefe6; --ok-line:#8ccbb0;
  --bad:#b23a26; --bad-soft:#f7e1db; --bad-line:#e3a493;
  --shadow:0 1px 2px rgba(16,32,48,.05), 0 10px 30px -18px rgba(16,32,48,.35);
  --radius:10px;
  --sans:"IBM Plex Sans", ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
  --serif:"IBM Plex Serif", ui-serif, Georgia, "Times New Roman", serif;
  --mono:"IBM Plex Mono", ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme: dark;
    --bg:#101519; --surface:#181f27; --surface-2:#202a34; --surface-3:#28343f;
    --border:#2c3844; --border-strong:#41505f;
    --text:#dfe6ee; --text-dim:#97a5b6; --text-faint:#758495;
    --accent:#7ab6e4; --accent-ink:#0d141a; --accent-soft:#1b3145;
    --ok:#5cc79c; --ok-soft:#16342a; --ok-line:#2f6d55;
    --bad:#ec8770; --bad-soft:#3a201a; --bad-line:#7d4032;
    --shadow:0 1px 2px rgba(0,0,0,.4), 0 12px 32px -20px rgba(0,0,0,.9);
  }
}
:root[data-theme="dark"]{
  color-scheme: dark;
  --bg:#101519; --surface:#181f27; --surface-2:#202a34; --surface-3:#28343f;
  --border:#2c3844; --border-strong:#41505f;
  --text:#dfe6ee; --text-dim:#97a5b6; --text-faint:#758495;
  --accent:#7ab6e4; --accent-ink:#0d141a; --accent-soft:#1b3145;
  --ok:#5cc79c; --ok-soft:#16342a; --ok-line:#2f6d55;
  --bad:#ec8770; --bad-soft:#3a201a; --bad-line:#7d4032;
  --shadow:0 1px 2px rgba(0,0,0,.4), 0 12px 32px -20px rgba(0,0,0,.9);
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:var(--bg); color:var(--text);
  font-family:var(--sans); font-size:15px; line-height:1.55;
  -webkit-font-smoothing:antialiased;
}
main{width:min(780px, 100% - 2rem); margin:0 auto; padding:0 0 5rem}
button{font:inherit; color:inherit; cursor:pointer}
:focus-visible{outline:2px solid var(--accent); outline-offset:2px; border-radius:4px}
.eyebrow{
  font-size:11px; font-weight:600; letter-spacing:.09em; text-transform:uppercase;
  color:var(--text-faint); font-family:var(--sans);
}
.mono{font-family:var(--mono)}
.num{font-variant-numeric:tabular-nums}

/* ---------- barra superior ---------- */
header.bar{
  position:sticky; top:0; z-index:10;
  background:var(--bg);
  border-bottom:1px solid var(--border);
}
.bar-inner{width:min(780px, 100% - 2rem); margin:0 auto; padding:.7rem 0 .9rem}
.bar-top{display:flex; align-items:baseline; justify-content:space-between; gap:.4rem 1rem; flex-wrap:wrap}
.bar-title{display:flex; align-items:baseline; gap:.55rem; min-width:0}
.bar-title b{font-weight:600; font-size:14px; letter-spacing:-.01em}
.bar-stats{display:flex; align-items:baseline; gap:.4rem 1.1rem; flex-wrap:wrap; font-size:13px; color:var(--text-dim)}
.bar-stats b{font-family:var(--mono); font-weight:500; color:var(--text); font-variant-numeric:tabular-nums}
.bar-stats .ok b{color:var(--ok)}
.bar-stats .bad b{color:var(--bad)}

.meter-wrap{position:relative; margin-top:.6rem}
.meter{
  position:relative; display:flex; height:9px;
  background:var(--surface-3); border-radius:99px; overflow:hidden;
}
.meter i{display:block; height:100%; transition:width .28s ease}
.meter .m-ok{background:var(--ok)}
.meter .m-bad{background:var(--bad)}
.pass-tick{
  position:absolute; top:-3px; height:15px; left:60%; width:2px;
  background:var(--border-strong); border-radius:2px;
}
.meter-legend{
  display:flex; justify-content:space-between; margin-top:.35rem; position:relative;
  font-size:10.5px; letter-spacing:.06em; text-transform:uppercase; color:var(--text-faint);
}
.meter-legend .pass-label{position:absolute; left:60%; transform:translateX(-50%); white-space:nowrap}
.verdict-chip{
  font-size:11px; font-weight:600; letter-spacing:.05em; text-transform:uppercase;
  padding:.16rem .5rem; border-radius:99px; border:1px solid; white-space:nowrap;
}
.chip-ok{color:var(--ok); background:var(--ok-soft); border-color:var(--ok-line)}
.chip-bad{color:var(--bad); background:var(--bad-soft); border-color:var(--bad-line)}
.chip-live{color:var(--text-dim); background:var(--surface-2); border-color:var(--border)}

/* ---------- tarjetas ---------- */
.card{
  background:var(--surface); border:1px solid var(--border);
  border-radius:var(--radius); box-shadow:var(--shadow);
}
.pad{padding:1.5rem 1.6rem}
@media (max-width:560px){ .pad{padding:1.15rem 1.05rem} }

/* ---------- inicio ---------- */
.setup{margin-top:2.5rem}
.setup h1{
  font-family:var(--serif); font-weight:500; font-size:clamp(1.6rem, 4.5vw, 2.1rem);
  margin:.35rem 0 .4rem; letter-spacing:-.015em; text-wrap:balance;
}
.setup p.lede{color:var(--text-dim); margin:0 0 1.4rem; max-width:58ch}
.drop{
  border:1.5px dashed var(--border-strong); border-radius:var(--radius);
  padding:1.4rem; text-align:center; background:var(--surface-2);
  transition:border-color .15s, background .15s;
}
.drop.over{border-color:var(--accent); background:var(--accent-soft)}
.drop p{margin:.55rem 0 0; color:var(--text-dim); font-size:13px}
.db-loaded{
  display:flex; align-items:center; gap:.75rem; flex-wrap:wrap;
  padding:.8rem 1rem; border:1px solid var(--border); border-radius:var(--radius);
  background:var(--surface-2);
}
.db-loaded .dot{width:8px; height:8px; border-radius:99px; background:var(--ok); flex:none}
.db-loaded .name{font-family:var(--mono); font-size:13px; word-break:break-all}
.db-loaded .count{color:var(--text-dim); font-size:13px; margin-left:auto; white-space:nowrap}
.field{margin-top:1.5rem}
.field > .eyebrow{display:block; margin-bottom:.5rem}
.size-row{display:flex; align-items:center; gap:.6rem .75rem; flex-wrap:wrap}
.num-input{
  width:6.2rem; padding:.42rem .7rem; border-radius:var(--radius);
  border:1px solid var(--border-strong); background:var(--surface); color:var(--text);
  font-family:var(--mono); font-size:14px; font-variant-numeric:tabular-nums;
}
.size-hint{color:var(--text-dim); font-size:13px}
.chip{
  padding:.42rem .85rem; border-radius:99px; border:1px solid var(--border-strong);
  background:var(--surface); font-size:13.5px; font-variant-numeric:tabular-nums;
}
.chip[aria-pressed="true"]{background:var(--accent); border-color:var(--accent); color:var(--accent-ink); font-weight:500}
.btn{
  border:1px solid var(--accent); background:var(--accent); color:var(--accent-ink);
  padding:.6rem 1.15rem; border-radius:var(--radius); font-weight:500; font-size:14.5px;
}
.btn:hover{filter:brightness(1.07)}
.btn[disabled]{opacity:.45; cursor:not-allowed; filter:none}
.btn-ghost{background:transparent; color:var(--text); border-color:var(--border-strong)}
.btn-ghost:hover{background:var(--surface-2); filter:none}
.btn-link{background:none; border:none; padding:0; color:var(--accent); text-decoration:underline; font-size:13px}
.row-end{display:flex; justify-content:flex-end; gap:.6rem; margin-top:1.6rem; flex-wrap:wrap}
.err{color:var(--bad); font-size:13.5px; margin-top:.8rem}

/* ---------- pregunta ---------- */
.q-head{display:flex; align-items:center; gap:.7rem; margin-bottom:.9rem}
.q-head .n{font-family:var(--mono); font-size:12px; color:var(--text-dim); font-variant-numeric:tabular-nums}
.q-head .rule{flex:1; height:1px; background:var(--border)}
.statement{font-family:var(--serif); font-size:17px; line-height:1.6}
.statement p{margin:0 0 .8rem}
.statement > :last-child{margin-bottom:0}
.statement ul{margin:.5rem 0 .8rem; padding-left:1.15rem}
.statement li{margin:.2rem 0}
code{
  font-family:var(--mono); font-size:.88em; background:var(--surface-2);
  border:1px solid var(--border); border-radius:4px; padding:.08em .32em;
}
pre{
  margin:.7rem 0; padding:.85rem 1rem; background:var(--surface-2);
  border:1px solid var(--border); border-radius:8px; overflow-x:auto;
}
pre code{background:none; border:none; padding:0; font-size:12.5px; line-height:1.5}
table{border-collapse:collapse; margin:.7rem 0; font-size:13.5px; font-family:var(--sans)}
th,td{border:1px solid var(--border); padding:.35rem .65rem; text-align:left}
th{background:var(--surface-2); font-weight:600; font-size:12px; letter-spacing:.03em; text-transform:uppercase}
.scroll-x{overflow-x:auto}

.opts{list-style:none; margin:1.3rem 0 0; padding:0; display:flex; flex-direction:column; gap:.5rem}
.opt{
  width:100%; text-align:left; display:flex; gap:.75rem; align-items:flex-start;
  background:var(--surface); border:1px solid var(--border); border-left:3px solid var(--border);
  border-radius:8px; padding:.7rem .85rem; transition:border-color .12s, background .12s;
}
.opt:hover:not(.locked){border-color:var(--border-strong); border-left-color:var(--accent); background:var(--surface-2)}
.opt .key{
  font-family:var(--mono); font-size:12px; font-weight:500; line-height:1.5;
  color:var(--text-dim); flex:none; min-width:1.5em; text-align:center;
  border-radius:4px; background:var(--surface-2); border:1px solid var(--border);
}
.opt .body{flex:1; min-width:0}
.opt .body.sql{font-family:var(--mono); font-size:13px; line-height:1.5; word-break:break-word}
.opt .body > pre:first-child{margin-top:0}
.opt .body > pre:last-child{margin-bottom:0}
.opt .mark{flex:none; font-size:14px; font-weight:600; line-height:1.5; width:1em}
.opt.locked{cursor:default}
.opt.is-ok{border-color:var(--ok-line); border-left-color:var(--ok); background:var(--ok-soft)}
.opt.is-ok .key{color:var(--ok); border-color:var(--ok-line); background:transparent}
.opt.is-ok .mark{color:var(--ok)}
.opt.is-bad{border-color:var(--bad-line); border-left-color:var(--bad); background:var(--bad-soft)}
.opt.is-bad .key{color:var(--bad); border-color:var(--bad-line); background:transparent}
.opt.is-bad .mark{color:var(--bad)}
.opt.dim{opacity:.5}
.opt.picked{border-left-color:var(--accent); border-color:var(--border-strong); background:var(--surface-2)}

/* emparejar */
.group{border:1px solid var(--border); border-radius:8px; padding:.75rem .85rem; background:var(--surface)}
.groups{margin-top:1.3rem; display:flex; flex-direction:column; gap:.5rem}
.group-label{font-weight:600; font-size:14px; margin-bottom:.5rem}
.group-opts{display:flex; gap:.4rem; flex-wrap:wrap}
.tile{
  border:1px solid var(--border); border-left:3px solid var(--border); background:var(--surface-2);
  border-radius:6px; padding:.35rem .7rem; font-size:13.5px;
}
.tile:hover:not(.locked){border-color:var(--border-strong)}
.tile[aria-pressed="true"]{border-left-color:var(--accent); background:var(--accent-soft); font-weight:500}
.tile.is-ok{border-color:var(--ok-line); border-left-color:var(--ok); background:var(--ok-soft); color:var(--ok)}
.tile.is-bad{border-color:var(--bad-line); border-left-color:var(--bad); background:var(--bad-soft); color:var(--bad)}
.tile.locked{cursor:default}

.feedback{margin-top:1.2rem; padding-top:1.1rem; border-top:1px solid var(--border)}
.verdict{display:flex; align-items:center; gap:.6rem; font-weight:600; font-size:14.5px}
.verdict.ok{color:var(--ok)}
.verdict.bad{color:var(--bad)}
.reveal{margin-top:.7rem; font-size:14px}
.note{
  margin-top:.8rem; padding:.7rem .9rem; border-left:3px solid var(--border-strong);
  background:var(--surface-2); border-radius:0 6px 6px 0; font-size:13.5px; color:var(--text-dim);
}
.note p:first-child{margin-top:0}
.note p:last-child{margin-bottom:0}
.hint{font-size:12px; color:var(--text-faint); margin-top:1rem; margin-bottom:0}
kbd{
  font-family:var(--mono); font-size:11px; border:1px solid var(--border-strong);
  border-bottom-width:2px; border-radius:4px; padding:.05em .35em; background:var(--surface-2);
}

/* ---------- resultado ---------- */
.score-head{display:flex; align-items:flex-end; gap:1.5rem; flex-wrap:wrap}
.score-big{
  font-family:var(--mono); font-size:clamp(3rem, 12vw, 4.4rem); font-weight:500;
  line-height:.95; letter-spacing:-.04em; font-variant-numeric:tabular-nums;
}
.score-big.ok{color:var(--ok)}
.score-big.bad{color:var(--bad)}
.score-meta{display:flex; flex-direction:column; align-items:flex-start; gap:.4rem; padding-bottom:.4rem}
.tally{
  display:grid; grid-template-columns:repeat(auto-fit, minmax(130px,1fr)); gap:1px;
  margin-top:1.6rem; background:var(--border); border:1px solid var(--border); border-radius:8px; overflow:hidden;
}
.tally div{background:var(--surface); padding:.75rem .9rem}
.tally .v{font-family:var(--mono); font-size:20px; font-variant-numeric:tabular-nums; line-height:1.3}
.tally .v.ok{color:var(--ok)}
.tally .v.bad{color:var(--bad)}
.review{margin-top:2rem}
.review h2{font-family:var(--serif); font-weight:500; font-size:1.15rem; margin:0 0 .2rem}
.review .sub{color:var(--text-dim); font-size:13.5px; margin:0 0 1rem}
details.miss{border:1px solid var(--border); border-radius:8px; background:var(--surface); margin-bottom:.5rem}
details.miss > summary{
  padding:.7rem .9rem; cursor:pointer; display:flex; gap:.7rem; align-items:flex-start;
  list-style:none; font-size:14px;
}
details.miss > summary::-webkit-details-marker{display:none}
details.miss > summary .qn{font-family:var(--mono); font-size:12px; color:var(--text-faint); flex:none; padding-top:.15rem}
details.miss > summary .txt{flex:1; min-width:0}
details.miss[open] > summary{border-bottom:1px solid var(--border)}
.miss-body{padding:.9rem}
.ans-line{display:flex; gap:.6rem; align-items:flex-start; font-size:13.5px; margin-top:.5rem}
.ans-line .tag{
  flex:none; font-size:10.5px; font-weight:600; letter-spacing:.06em; text-transform:uppercase;
  padding:.12rem .4rem; border-radius:4px; margin-top:.15rem;
}
.tag-ok{color:var(--ok); background:var(--ok-soft)}
.tag-bad{color:var(--bad); background:var(--bad-soft)}
@media (prefers-reduced-motion: reduce){ *{transition:none !important; animation:none !important} }
</style>
</head>
<body>

<header class="bar" id="bar" hidden>
  <div class="bar-inner">
    <div class="bar-top">
      <div class="bar-title">
        <b id="barTitle">Cuestionario</b>
        <span class="eyebrow num" id="barPos"></span>
      </div>
      <div class="bar-stats">
        <span class="ok">Aciertos <b id="statOk">0</b></span>
        <span class="bad">Fallos <b id="statBad">0</b></span>
        <span>Precisión <b id="statPct">&mdash;</b></span>
        <span class="verdict-chip chip-live" id="statChip">Sin responder</span>
      </div>
    </div>
    <div class="meter-wrap">
      <div class="meter" id="meter">
        <i class="m-ok" id="mOk" style="width:0%"></i>
        <i class="m-bad" id="mBad" style="width:0%"></i>
      </div>
      <span class="pass-tick" aria-hidden="true"></span>
      <div class="meter-legend">
        <span>0%</span>
        <span class="pass-label">60% aprobado</span>
        <span>100%</span>
      </div>
    </div>
  </div>
</header>

<main id="app"></main>

<script>
"use strict";

/* ============================ PARSER START ============================
   Lee un .md con la estructura del README:
     # Titulo
     ## Pregunta N
     **Enunciado:** ...
     - a. alternativa
     - OK b. alternativa correcta   (OK = marca de verificacion)
   ==================================================================== */

var OK = "✅";

function parseDB(md){
  var lines = String(md).replace(/\r\n?/g, "\n").split("\n");
  var title = null, fence = false, cur = null, blocks = [];
  for (var i = 0; i < lines.length; i++){
    var line = lines[i];
    var isFence = /^\s*```/.test(line);
    if (isFence) fence = !fence;
    if (!fence && !isFence){
      var h2 = line.match(/^##\s+(.+?)\s*$/);
      if (h2){ cur = { label: h2[1], lines: [] }; blocks.push(cur); continue; }
      var h1 = line.match(/^#\s+(.+?)\s*$/);
      if (h1){ if (title === null) title = h1[1]; continue; }
    }
    if (cur) cur.lines.push(line);
  }
  var questions = [];
  blocks.forEach(function(b, i){
    var q = parseQuestion(b.label, b.lines, questions.length);
    if (q) questions.push(q);
  });
  return { title: title || "Cuestionario", questions: questions };
}

var RE_TOP = /^- (.*)$/;
var RE_NESTED = /^ +[-*] (.*)$/;
var RE_LETTER = /^([a-z])[.)]\s*(.*)$/i;

function parseQuestion(label, raw, idx){
  // 1. clasificar cada linea (respetando bloques de codigo)
  var marks = [], fence = false;
  raw.forEach(function(line, i){
    var isFence = /^\s*```/.test(line);
    if (isFence){ marks[i] = { kind: "fence" }; fence = !fence; return; }
    if (fence){ marks[i] = { kind: "code" }; return; }
    if (line.trim() === ""){ marks[i] = { kind: "blank" }; return; }
    var mt = line.match(RE_TOP);
    if (mt){ marks[i] = { kind: "top", text: mt[1] }; return; }
    var mn = line.match(RE_NESTED);
    if (mn){ marks[i] = { kind: "nested", text: mn[1] }; return; }
    if (/^\s/.test(line)){ marks[i] = { kind: "indent" }; return; }
    marks[i] = { kind: "text" };
  });

  // 2. donde empiezan las alternativas: primera vineta con letra (a. b. c.);
  //    si no hay letras, la primera vineta de nivel 0
  var start = -1, i;
  for (i = 0; i < marks.length; i++){
    if (marks[i].kind === "top" && RE_LETTER.test(marks[i].text.split(OK).join("").trim())){ start = i; break; }
  }
  if (start === -1){
    for (i = 0; i < marks.length; i++){ if (marks[i].kind === "top"){ start = i; break; } }
  }
  if (start === -1) return null;

  // 3. enunciado
  var statement = raw.slice(0, start);
  while (statement.length && statement[statement.length - 1].trim() === "") statement.pop();

  // 4. alternativas + cola
  var options = [], tailStart = raw.length;
  i = start;
  while (i < raw.length){
    var m = marks[i];
    if (m.kind === "top"){ options.push({ raw: m.text, lines: [], children: [] }); i++; continue; }
    if (!options.length){ i++; continue; }
    if (m.kind === "nested"){
      var t = m.text.trim(), correct = t.indexOf(OK) === 0;
      options[options.length - 1].children.push({ text: correct ? t.slice(OK.length).trim() : t, correct: correct });
      i++; continue;
    }
    if (m.kind === "blank" || m.kind === "indent" || m.kind === "code" || m.kind === "fence"){
      options[options.length - 1].lines.push(raw[i]); i++; continue;
    }
    tailStart = i; break;
  }
  var tail = raw.slice(tailStart);

  // 5. normalizar alternativas
  options.forEach(function(o, k){
    var t = o.raw.trim();
    o.correct = t.indexOf(OK) === 0;
    if (o.correct) t = t.slice(OK.length).trim();
    var lm = t.match(RE_LETTER);
    if (lm){ o.key = lm[1].toLowerCase(); t = lm[2].trim(); }
    else { o.key = String(k + 1); }
    o.text = t;
    while (o.lines.length && o.lines[0].trim() === "") o.lines.shift();
    while (o.lines.length && o.lines[o.lines.length - 1].trim() === "") o.lines.pop();
  });

  // 6. cola: revelacion (lleva la marca) y notas (>)
  var reveal = [], note = [];
  tail.forEach(function(l){ (l.trim().indexOf(">") === 0 ? note : reveal).push(l); });
  function trim(a){
    var c = a.slice();
    while (c.length && c[0].trim() === "") c.shift();
    while (c.length && c[c.length - 1].trim() === "") c.pop();
    return c;
  }
  reveal = trim(reveal); note = trim(note);

  // 7. tipo de pregunta
  var hasChildren = options.some(function(o){ return o.children.length > 0; });
  var nCorrect = options.filter(function(o){ return o.correct; }).length;
  var type;
  if (hasChildren) type = "match";
  else if (nCorrect === 1) type = "single";
  else if (nCorrect > 1) type = "multi";
  else if (reveal.some(function(l){ return l.indexOf(OK) !== -1; })) type = "selfgrade";
  else type = "single";

  var num = (label.match(/(\d+)/) || [])[1];
  return {
    id: idx, label: label, num: num ? Number(num) : idx + 1,
    statement: statement, options: options, type: type, reveal: reveal, note: note
  };
}
/* ============================= PARSER END ============================= */

/* ------------------------- markdown -> html -------------------------- */
function esc(s){
  return String(s).replace(/[&<>"]/g, function(c){
    return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c];
  });
}

var SENT = "\u0001"; // marcador interno para los tramos `code`

function mdInline(s){
  var codes = [];
  s = String(s).replace(/`([^`]+)`/g, function(m, c){ codes.push(c); return SENT + (codes.length - 1) + SENT; });
  s = esc(s);
  s = s.replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>");
  s = s.replace(/(^|[^*])\*([^*\n]+)\*/g, "$1<em>$2</em>");
  return s.replace(new RegExp(SENT + "(\\d+)" + SENT, "g"), function(m, i){
    return "<code>" + esc(codes[Number(i)]) + "</code>";
  });
}

function mdBlock(lines){
  var L = lines || [], out = [], i = 0;
  while (i < L.length){
    var line = L[i];
    if (/^\s*```/.test(line)){
      var buf = [];
      i++;
      while (i < L.length && !/^\s*```/.test(L[i])) buf.push(L[i++]);
      i++;
      out.push("<pre><code>" + esc(buf.join("\n")) + "</code></pre>");
      continue;
    }
    if (/^\s*\|/.test(line)){
      var rows = [];
      while (i < L.length && /^\s*\|/.test(L[i])) rows.push(L[i++]);
      var cells = function(r){ return r.trim().replace(/^\||\|$/g, "").split("|").map(function(c){ return c.trim(); }); };
      var head = null, body = rows;
      if (rows.length > 1 && /^[\s|:-]+$/.test(rows[1])){ head = cells(rows[0]); body = rows.slice(2); }
      var t = '<div class="scroll-x"><table>';
      if (head) t += "<thead><tr>" + head.map(function(c){ return "<th>" + mdInline(c) + "</th>"; }).join("") + "</tr></thead>";
      t += "<tbody>" + body.map(function(r){
        return "<tr>" + cells(r).map(function(c){ return "<td>" + mdInline(c) + "</td>"; }).join("") + "</tr>";
      }).join("") + "</tbody></table></div>";
      out.push(t);
      continue;
    }
    if (/^\s*>/.test(line)){
      var qb = [];
      while (i < L.length && /^\s*>/.test(L[i])) qb.push(L[i++].replace(/^\s*>\s?/, ""));
      out.push('<div class="note">' + mdBlock(qb) + "</div>");
      continue;
    }
    if (/^\s*[-*]\s+/.test(line)){
      var items = [];
      while (i < L.length && /^\s*[-*]\s+/.test(L[i])) items.push(L[i++].replace(/^\s*[-*]\s+/, ""));
      out.push("<ul>" + items.map(function(x){ return "<li>" + mdInline(x) + "</li>"; }).join("") + "</ul>");
      continue;
    }
    if (line.trim() === ""){ i++; continue; }
    var para = [];
    while (i < L.length && L[i].trim() !== "" && !/^\s*(```|\||>|[-*]\s)/.test(L[i])){
      var hard = /\S {2,}$/.test(L[i]);
      para.push(mdInline(L[i].replace(/\s+$/, "")) + (hard ? "<br>" : ""));
      i++;
    }
    out.push("<p>" + para.join(" ") + "</p>");
  }
  return out.join("");
}

var SQLISH = /^\s*(SELECT|INSERT|UPDATE|DELETE|CREATE|ALTER|DROP|GRANT|REVOKE|WITH|BEGIN|COMMIT|ROLLBACK|SAVEPOINT|CALL|DECLARE|SET|TRUNCATE|COPY|EXPLAIN|VACUUM|REINDEX|ANALYZE|PREPARE|EXECUTE|CLUSTER|COMMENT|REASSIGN|SHOW)\b/i;
function looksSql(t){ return !!t && (SQLISH.test(t) || /;\s*$/.test(t.trim())); }

/* ----------------------------- estado ------------------------------- */
var S = { db: null, dbName: "", count: null, order: [], idx: 0, answers: [], pick: null, answered: false, matchPick: {} };
var app = document.getElementById("app");
var bar = document.getElementById("bar");
var PASS = 0.6;

function shuffle(a){
  var r = a.slice(), i, j, t;
  for (i = r.length - 1; i > 0; i--){
    j = Math.floor(Math.random() * (i + 1));
    t = r[i]; r[i] = r[j]; r[j] = t;
  }
  return r;
}

// null (o basura) = todas; si no, entre 1 y max
function clampCount(v, max){
  v = Math.floor(Number(v));
  if (!isFinite(v) || v < 1) return max;
  return Math.min(v, max);
}

/* --------------------------- carga del .md --------------------------- */
function loadText(text, name){
  var db = parseDB(text);
  if (!db.questions.length) throw new Error("No se encontró ninguna pregunta con el formato «## Pregunta N».");
  S.db = db; S.dbName = name; S.count = null;
  return db;
}

// Nada queda precargado: cada sesión arranca eligiendo el .md a mano.
function boot(){ renderSetup(); }

/* --------------------------- pantalla inicio ------------------------- */
function renderSetup(msg){
  bar.hidden = true;
  var n = S.db ? S.db.questions.length : 0;
  if (n) S.count = clampCount(S.count, n);

  app.innerHTML =
    '<section class="card pad setup">' +
      '<span class="eyebrow">Simulador de examen</span>' +
      "<h1>" + (S.db ? esc(S.db.title) : "Carga tu banco de preguntas") + "</h1>" +
      '<p class="lede">Las preguntas salen en orden aleatorio en cada intento, se responden de una en una y no se puede volver atrás. El examen completo vale 100% y se aprueba con <strong>60%</strong>.</p>' +
      '<div id="dbSlot"></div>' +
      '<div class="field"' + (S.db ? "" : " hidden") + ">" +
        '<span class="eyebrow">Cuántas preguntas</span>' +
        '<div class="size-row">' +
          '<input type="number" id="count" class="num-input" inputmode="numeric" min="1" max="' + n + '" step="1" value="' + (n ? S.count : "") + '" aria-label="Cantidad de preguntas">' +
          '<span class="size-hint">de ' + n + " disponibles</span>" +
          '<button class="chip" id="allBtn" aria-pressed="' + (S.count === n) + '">Todas</button>' +
        "</div>" +
      "</div>" +
      (msg ? '<p class="err">' + esc(msg) + "</p>" : "") +
      '<div class="row-end"><button class="btn" id="start"' + (S.db ? "" : " disabled") + ">Empezar</button></div>" +
    "</section>";

  var slot = document.getElementById("dbSlot");
  if (S.db){
    slot.innerHTML =
      '<div class="db-loaded">' +
        '<span class="dot"></span>' +
        '<span class="name">' + esc(S.dbName) + "</span>" +
        '<span class="count num">' + n + " preguntas</span>" +
        '<button class="btn-link" id="change">Cambiar base</button>' +
      "</div>";
    document.getElementById("change").onclick = function(){ S.db = null; S.count = null; renderSetup(); };
  } else {
    slot.innerHTML =
      '<div class="drop" id="drop">' +
        '<button class="btn btn-ghost" id="pick">Elegir archivo .md</button>' +
        "<p>o arrastralo acá &mdash; formato <code>## Pregunta N</code> con alternativas marcadas con " + OK + "</p>" +
        '<input type="file" id="file" accept=".md,.markdown,.txt,text/markdown" hidden>' +
      "</div>";
    var drop = document.getElementById("drop");
    var file = document.getElementById("file");
    document.getElementById("pick").onclick = function(){ file.click(); };
    file.onchange = function(){ if (file.files[0]) readFile(file.files[0]); };
    ["dragenter", "dragover"].forEach(function(ev){
      drop.addEventListener(ev, function(e){ e.preventDefault(); drop.classList.add("over"); });
    });
    ["dragleave", "drop"].forEach(function(ev){
      drop.addEventListener(ev, function(e){ e.preventDefault(); drop.classList.remove("over"); });
    });
    drop.addEventListener("drop", function(e){
      var f = e.dataTransfer && e.dataTransfer.files[0];
      if (f) readFile(f);
    });
  }

  var countBox = document.getElementById("count");
  var allBtn = document.getElementById("allBtn");
  function syncCount(){
    S.count = clampCount(countBox.value, n);
    countBox.value = S.count;
    allBtn.setAttribute("aria-pressed", String(S.count === n));
  }
  if (countBox){
    countBox.oninput = function(){
      var v = Math.floor(Number(countBox.value));
      if (countBox.value !== "" && isFinite(v) && v >= 1){
        S.count = Math.min(v, n);
        allBtn.setAttribute("aria-pressed", String(S.count === n));
      }
    };
    countBox.onchange = syncCount;
    countBox.onkeydown = function(e){
      if (e.key === "Enter"){ e.preventDefault(); syncCount(); beginAttempt(); }
    };
    allBtn.onclick = function(){ countBox.value = n; syncCount(); };
  }
  var start = document.getElementById("start");
  if (start) start.onclick = function(){ if (countBox) syncCount(); beginAttempt(); };
}

function readFile(f){
  var r = new FileReader();
  r.onload = function(){
    try { loadText(r.result, f.name); renderSetup(); }
    catch(err){ renderSetup(err.message); }
  };
  r.readAsText(f);
}

/* ------------------------------ intento ------------------------------ */
function beginAttempt(){
  var all = shuffle(S.db.questions);
  var n = clampCount(S.count, all.length);
  S.order = all.slice(0, n);
  S.idx = 0; S.answers = []; S.pick = null; S.answered = false; S.matchPick = {};
  document.getElementById("barTitle").textContent = S.db.title;
  bar.hidden = false;
  renderQuestion();
}

function stats(){
  var total = S.order.length;
  var ok = S.answers.filter(function(a){ return a.correct; }).length;
  return { total: total, ok: ok, bad: S.answers.length - ok, answered: S.answers.length, left: total - S.answers.length };
}

function updateBar(){
  var s = stats();
  document.getElementById("barPos").textContent = "Pregunta " + Math.min(S.idx + 1, s.total) + " de " + s.total;
  document.getElementById("statOk").textContent = s.ok;
  document.getElementById("statBad").textContent = s.bad;
  document.getElementById("statPct").textContent = s.answered ? Math.round(s.ok / s.answered * 100) + "%" : "—";
  document.getElementById("mOk").style.width = (s.ok / s.total * 100) + "%";
  document.getElementById("mBad").style.width = (s.bad / s.total * 100) + "%";
  var chip = document.getElementById("statChip");
  chip.className = "verdict-chip";
  if (!s.answered){ chip.classList.add("chip-live"); chip.textContent = "Sin responder"; }
  else if (s.ok / s.total >= PASS){ chip.classList.add("chip-ok"); chip.textContent = "Aprobado asegurado"; }
  else if ((s.ok + s.left) / s.total < PASS){ chip.classList.add("chip-bad"); chip.textContent = "Ya no alcanza"; }
  else { chip.classList.add("chip-live"); chip.textContent = "Faltan " + (Math.ceil(PASS * s.total) - s.ok) + " aciertos"; }
}

var TYPE_LABEL = { single: "Opción múltiple", multi: "Varias correctas", match: "Emparejar", selfgrade: "Completar" };

function renderQuestion(){
  var q = S.order[S.idx];
  S.pick = null; S.answered = false; S.matchPick = {};
  updateBar();

  var optsHtml;
  if (q.type === "match"){
    optsHtml = '<div class="groups">' + q.options.map(function(o, gi){
      return '<div class="group">' +
        '<div class="group-label">' + mdInline(o.text) + "</div>" +
        '<div class="group-opts">' + o.children.map(function(c, ci){
          return '<button class="tile" data-g="' + gi + '" data-c="' + ci + '" aria-pressed="false">' + mdInline(c.text) + "</button>";
        }).join("") + "</div></div>";
    }).join("") + "</div>";
  } else {
    optsHtml = '<ul class="opts">' + q.options.map(function(o, k){
      return "<li><button class=\"opt\" data-i=\"" + k + "\">" +
        '<span class="key">' + esc(o.key) + "</span>" +
        '<span class="body' + (looksSql(o.text) ? " sql" : "") + '">' +
          (o.text ? mdInline(o.text) : "") + (o.lines.length ? mdBlock(o.lines) : "") +
        "</span>" +
        '<span class="mark" aria-hidden="true"></span>' +
      "</button></li>";
    }).join("") + "</ul>";
  }

  app.innerHTML =
    '<section class="card pad" style="margin-top:1.6rem">' +
      '<div class="q-head">' +
        '<span class="n">' + esc(q.label) + "</span>" +
        '<span class="rule"></span>' +
        '<span class="eyebrow">' + (TYPE_LABEL[q.type] || "") + "</span>" +
      "</div>" +
      '<div class="statement">' + mdBlock(stripEnunciado(q.statement)) + "</div>" +
      optsHtml +
      '<div id="fb"></div>' +
      '<div class="row-end" id="actions"></div>' +
      '<p class="hint">Elegí con <kbd>1</kbd>&ndash;<kbd>9</kbd>, continuá con <kbd>Enter</kbd>. No se puede volver atrás.</p>' +
    "</section>";
  window.scrollTo(0, 0);

  if (q.type === "match"){
    Array.prototype.forEach.call(app.querySelectorAll(".tile"), function(t){
      t.onclick = function(){
        if (S.answered) return;
        var g = t.dataset.g;
        Array.prototype.forEach.call(app.querySelectorAll('.tile[data-g="' + g + '"]'), function(x){
          x.setAttribute("aria-pressed", "false");
        });
        t.setAttribute("aria-pressed", "true");
        S.matchPick[g] = Number(t.dataset.c);
        renderActions();
      };
    });
  } else {
    Array.prototype.forEach.call(app.querySelectorAll(".opt"), function(b){
      b.onclick = function(){
        if (S.answered) return;
        S.pick = Number(b.dataset.i);
        if (q.type === "multi"){ b.classList.toggle("picked"); renderActions(); }
        else { answer(); }
      };
    });
  }
  renderActions();
}

function stripEnunciado(lines){
  var c = (lines || []).slice();
  for (var i = 0; i < c.length; i++){
    if (c[i].trim() === "") continue;
    c[i] = c[i].replace(/^\s*\*\*Enunciado:?\*\*\s*/, "");
    break;
  }
  return c;
}

function renderActions(){
  var q = S.order[S.idx];
  var box = document.getElementById("actions");
  if (!box) return;
  if (S.answered){
    var last = S.idx === S.order.length - 1;
    box.innerHTML = '<button class="btn" id="next">' + (last ? "Ver resultado" : "Siguiente") + " &rarr;</button>";
    var nb = document.getElementById("next");
    nb.onclick = next;
    nb.focus({ preventScroll: true });
    return;
  }
  if (q.type === "match"){
    var done = Object.keys(S.matchPick).length === q.options.length;
    box.innerHTML = '<button class="btn" id="check"' + (done ? "" : " disabled") + ">Responder</button>";
    if (done) document.getElementById("check").onclick = answer;
    return;
  }
  if (q.type === "multi"){
    box.innerHTML = '<button class="btn" id="check">Responder</button>';
    document.getElementById("check").onclick = answer;
    return;
  }
  box.innerHTML = "";
}

function answer(){
  var q = S.order[S.idx];
  var correct = false, picked = null;

  if (q.type === "match"){
    correct = q.options.every(function(o, gi){
      var c = o.children[S.matchPick[gi]];
      return !!(c && c.correct);
    });
    Array.prototype.forEach.call(app.querySelectorAll(".tile"), function(t){
      var o = q.options[Number(t.dataset.g)];
      var c = o.children[Number(t.dataset.c)];
      var chosen = S.matchPick[t.dataset.g] === Number(t.dataset.c);
      t.classList.add("locked");
      t.setAttribute("aria-pressed", "false");
      if (c.correct) t.classList.add("is-ok");
      else if (chosen) t.classList.add("is-bad");
    });
    picked = q.options.map(function(o, gi){
      var c = o.children[S.matchPick[gi]];
      return o.text + ": " + (c ? c.text : "—");
    }).join(" · ");
  } else if (q.type === "multi"){
    var chosen = Array.prototype.map.call(app.querySelectorAll(".opt.picked"), function(b){ return Number(b.dataset.i); });
    correct = q.options.every(function(o, i){ return o.correct === (chosen.indexOf(i) !== -1); });
    picked = chosen.map(function(i){ return q.options[i].key.toUpperCase(); }).join(", ");
    lockOptions(q, chosen, false);
  } else if (q.type === "selfgrade"){
    picked = q.options[S.pick].key.toUpperCase();
    lockOptions(q, [S.pick], true);
  } else {
    correct = !!q.options[S.pick].correct;
    picked = q.options[S.pick].key.toUpperCase();
    lockOptions(q, [S.pick], false);
  }

  S.answered = true;

  if (q.type === "selfgrade"){
    document.getElementById("fb").innerHTML =
      '<div class="feedback">' +
        '<div class="verdict"><span aria-hidden="true">●</span> Compará con la respuesta correcta</div>' +
        '<div class="reveal">' + mdBlock(q.reveal) + "</div>" +
        (q.note.length ? mdBlock(q.note) : "") +
      "</div>";
    document.getElementById("actions").innerHTML =
      '<button class="btn btn-ghost" id="sgBad">Fallé</button>' +
      '<button class="btn" id="sgOk">Acerté</button>';
    document.getElementById("sgOk").onclick = function(){ finishAnswer(q, true, picked); };
    document.getElementById("sgBad").onclick = function(){ finishAnswer(q, false, picked); };
    return;
  }
  finishAnswer(q, correct, picked);
}

function lockOptions(q, chosen, hideMarks){
  Array.prototype.forEach.call(app.querySelectorAll(".opt"), function(b){
    var i = Number(b.dataset.i);
    var o = q.options[i];
    b.classList.add("locked");
    b.classList.remove("picked");
    if (hideMarks){
      if (chosen.indexOf(i) !== -1) b.classList.add("picked");
      return;
    }
    if (o.correct){ b.classList.add("is-ok"); b.querySelector(".mark").textContent = "✓"; }
    else if (chosen.indexOf(i) !== -1){ b.classList.add("is-bad"); b.querySelector(".mark").textContent = "✕"; }
    else b.classList.add("dim");
  });
}

function finishAnswer(q, correct, picked){
  S.answers.push({ q: q, correct: correct, picked: picked });
  S.answered = true;
  var fb = document.getElementById("fb");
  if (q.type === "selfgrade"){
    var v = fb.querySelector(".verdict");
    v.className = "verdict " + (correct ? "ok" : "bad");
    v.innerHTML = '<span aria-hidden="true">' + (correct ? "✓" : "✕") + "</span> " +
      (correct ? "Marcada como acierto" : "Marcada como fallo");
  } else {
    var right = q.type === "match"
      ? q.options.map(function(o){
          var c = o.children.filter(function(x){ return x.correct; })[0];
          return o.text + ": " + (c ? c.text : "");
        }).join(" · ")
      : q.options.filter(function(o){ return o.correct; }).map(function(o){ return o.key.toUpperCase(); }).join(", ");
    fb.innerHTML =
      '<div class="feedback">' +
        '<div class="verdict ' + (correct ? "ok" : "bad") + '">' +
          '<span aria-hidden="true">' + (correct ? "✓" : "✕") + "</span>" +
          (correct ? "Correcto" : "Incorrecto — la respuesta es " + esc(right).replace(/\*\*/g, "")) +
        "</div>" +
        (q.reveal.length ? '<div class="reveal">' + mdBlock(q.reveal) + "</div>" : "") +
        (q.note.length ? mdBlock(q.note) : "") +
      "</div>";
  }
  updateBar();
  renderActions();
}

function next(){
  if (S.idx === S.order.length - 1){ renderResult(); return; }
  S.idx++;
  renderQuestion();
}

/* ----------------------------- resultado ----------------------------- */
function renderResult(){
  var s = stats();
  var pct = Math.round(s.ok / s.total * 1000) / 10;
  var pass = s.ok / s.total >= PASS;
  var need = Math.ceil(PASS * s.total);
  var misses = S.answers.filter(function(a){ return !a.correct; });
  document.getElementById("barPos").textContent = s.total + " de " + s.total + " respondidas";

  app.innerHTML =
    '<section class="card pad" style="margin-top:1.6rem">' +
      '<span class="eyebrow">Resultado del intento</span>' +
      '<div class="score-head" style="margin-top:.6rem">' +
        '<div class="score-big ' + (pass ? "ok" : "bad") + '">' + pct + "%</div>" +
        '<div class="score-meta">' +
          '<span class="verdict-chip ' + (pass ? "chip-ok" : "chip-bad") + '">' + (pass ? "Aprobado" : "Reprobado") + "</span>" +
          '<span style="color:var(--text-dim); font-size:13.5px">Se aprueba con 60% — ' + need + " de " + s.total + " preguntas</span>" +
        "</div>" +
      "</div>" +
      '<div class="tally">' +
        '<div><div class="v num ok">' + s.ok + '</div><span class="eyebrow">Aciertos</span></div>' +
        '<div><div class="v num bad">' + s.bad + '</div><span class="eyebrow">Fallos</span></div>' +
        '<div><div class="v num">' + s.total + '</div><span class="eyebrow">Respondidas</span></div>' +
        '<div><div class="v num">' + (pass ? "+" : "−") + Math.abs(s.ok - need) + '</div><span class="eyebrow">' + (pass ? "Sobre el corte" : "Bajo el corte") + "</span></div>" +
      "</div>" +
      '<div class="row-end">' +
        '<button class="btn btn-ghost" id="again2">Cambiar base</button>' +
        '<button class="btn" id="again">Reintentar (nuevo orden)</button>' +
      "</div>" +
    "</section>" +
    (misses.length ?
      '<section class="review">' +
        "<h2>Para repasar</h2>" +
        '<p class="sub">' + misses.length + (misses.length === 1 ? " pregunta fallada." : " preguntas falladas.") + "</p>" +
        misses.map(function(a){
          return '<details class="miss">' +
            '<summary><span class="qn">' + esc(a.q.label.replace(/^Pregunta\s*/i, "#")) + '</span>' +
            '<span class="txt">' + mdInline(firstLine(a.q)) + "</span></summary>" +
            '<div class="miss-body">' +
              '<div class="statement" style="font-size:15px">' + mdBlock(stripEnunciado(a.q.statement)) + "</div>" +
              '<div class="ans-line"><span class="tag tag-bad">Tu respuesta</span><span>' + esc(a.picked || "—") + "</span></div>" +
              '<div class="ans-line"><span class="tag tag-ok">Correcta</span><span>' + answerHtml(a.q) + "</span></div>" +
            "</div></details>";
        }).join("") +
      "</section>"
    : "");

  document.getElementById("again").onclick = beginAttempt;
  document.getElementById("again2").onclick = function(){ renderSetup(); };
  window.scrollTo(0, 0);
}

function firstLine(q){
  var lines = stripEnunciado(q.statement).filter(function(l){ return l.trim() !== ""; });
  var t = lines.length ? lines[0] : q.label;
  return t.length > 130 ? t.slice(0, 130) + "…" : t;
}

function answerHtml(q){
  if (q.type === "match"){
    return q.options.map(function(o){
      var c = o.children.filter(function(x){ return x.correct; })[0];
      return "<strong>" + mdInline(o.text) + "</strong> " + mdInline(c ? c.text : "");
    }).join("<br>");
  }
  if (q.type === "selfgrade") return mdBlock(q.reveal);
  return q.options.filter(function(o){ return o.correct; }).map(function(o){
    return '<strong class="mono">' + esc(o.key.toUpperCase()) + ".</strong> " +
      (o.text ? mdInline(o.text) : "") + (o.lines.length ? mdBlock(o.lines) : "");
  }).join("<br>");
}

/* ----------------------------- teclado ------------------------------- */
document.addEventListener("keydown", function(e){
  if (e.metaKey || e.ctrlKey || e.altKey) return;
  if (S.answered && (e.key === "Enter" || e.key === " ")){
    var nb = document.getElementById("next");
    if (nb){ e.preventDefault(); nb.click(); }
    return;
  }
  if (!S.order.length || S.answered) return;
  var n = Number(e.key);
  if (n >= 1 && n <= 9){
    var list = app.querySelectorAll(".opt");
    if (!list.length) list = app.querySelectorAll(".tile");
    var b = list[n - 1];
    if (b){ e.preventDefault(); b.click(); }
  }
});

boot();
</script>
</body>
</html>
